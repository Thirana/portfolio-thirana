<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 244" width="300" height="244">
  <style>
    .t { font: 600 13px "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #121211; }
    .m { font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #3b3b38; }
    .f { fill: #c8261c; }
    .mid { text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#62625d"/>
    </marker>
  </defs>
  <rect width="300" height="244" fill="#fbfbfa"/>

  <!-- Internet side -->
  <rect x="14" y="14" width="98" height="32" rx="2" fill="#fbfbfa" stroke="#757570" stroke-width="1.25"/>
  <text class="t mid" x="63" y="34.5">Shoppers</text>
  <rect x="164" y="14" width="120" height="32" rx="2" fill="#f3e9f3" stroke="#8e3394" stroke-width="1.25"/>
  <text class="t mid" x="224" y="34.5">Load balancer</text>
  <path d="M112 30H160" stroke="#62625d" stroke-width="1.25" fill="none" marker-end="url(#a)"/>

  <!-- kade-vpc -->
  <rect x="14" y="64" width="270" height="166" rx="2" fill="none" stroke="#268899" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text class="m" x="24" y="81">kade-vpc · 10.10.0.0/16</text>

  <!-- sn-app -->
  <rect x="24" y="90" width="250" height="48" rx="2" fill="none" stroke="#b9b9b4" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text class="m" x="34" y="110">sn-app</text>
  <text class="m" x="34" y="126">10.10.1.0/24</text>
  <rect x="174" y="99" width="94" height="30" rx="2" fill="#e5f0f2" stroke="#268899" stroke-width="1.25"/>
  <text class="t mid" x="221" y="118.5">kade-api</text>

  <!-- sn-data -->
  <rect x="24" y="148" width="250" height="48" rx="2" fill="none" stroke="#b9b9b4" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text class="m" x="34" y="168">sn-data</text>
  <text class="m" x="34" y="184">10.10.2.0/24</text>
  <rect x="174" y="157" width="94" height="30" rx="2" fill="#e4efe7" stroke="#21763c" stroke-width="1.25"/>
  <text class="t mid" x="221" y="176.5">kade-db</text>

  <!-- traffic -->
  <path d="M224 46V95" stroke="#8e3394" stroke-width="1.25" fill="none" marker-end="url(#a)"/>
  <path d="M221 129V153" stroke="#21763c" stroke-width="1.25" fill="none" marker-end="url(#a)"/>

  <!-- the planted fault: a firewall rule open to the internet -->
  <circle cx="30" cy="213" r="5" class="f"/>
  <text class="m f" x="42" y="217">allow-ssh · tcp:22 · 0.0.0.0/0</text>
</svg>
